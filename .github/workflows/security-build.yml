name: Published storage runtime readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.11.1
          persist-credentials: false
      - name: Verify exact released source and immutable runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a1ea8a0b483c9f8755cd23a4040cac06eafbb474
          mkdir -p evidence
          printf '%s\n' a1ea8a0b483c9f8755cd23a4040cac06eafbb474 > evidence/source-revision.txt
          scanner=aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          docker pull "$scanner"
          : > evidence/registry-images.jsonl
          for entry in nfs=sha256:5b2a9f7d5a65c824ef00c134553b6fb8cb440b5da0cd91c837a0c1844590ec13 ebs=sha256:f9b804a4fa3b6e54ce8f18b4becf526b5d48e0117aa2a8e0c690573f57c369ad efs=sha256:acd786fa4052b3469242c3071320e72fb8a2cb1b863e51074585c04affb72747; do
            driver="${entry%%=*}"
            digest="${entry#*=}"
            repository="ghcr.io/pasturestack/$driver-storage-driver"
            image="$repository@$digest"
            test "$(docker buildx imagetools inspect "$repository:v0.11.1" | awk '$1=="Digest:"{print $2; exit}')" = "$digest"
            docker pull "$image"
            docker run --rm --entrypoint /usr/bin/pasturestack-storage-runtime "$image" --version | grep -F v0.11.1
            docker run --rm --entrypoint sh "$image" -c 'apk info --installed ca-certificates=20261020-r0 >/dev/null && apk info --installed musl=1.2.5-r24 >/dev/null && apk info --installed zlib=1.3.2-r1 >/dev/null && apk info --installed libssl3=3.5.9-r0 >/dev/null'
            docker image inspect "$image" > "evidence/$driver-image.json"
            jq -e '.[0].Config.Labels["org.opencontainers.image.version"] == "v0.11.1"' "evidence/$driver-image.json"
            docker save "$image" --output "$RUNNER_TEMP/$driver.tar"
            docker run --rm -v "$RUNNER_TEMP/$driver.tar:/image.tar:ro" -v "$PWD/evidence:/evidence" "$scanner" image --input /image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output "/evidence/$driver-security.json"
            docker run --rm -v "$RUNNER_TEMP/$driver.tar:/image.tar:ro" -v "$PWD/evidence:/evidence" "$scanner" image --input /image.tar --format cyclonedx --output "/evidence/$driver-sbom.cdx.json"
            jq -n --arg image "$repository:v0.11.1" --arg digest "$digest" --arg source a1ea8a0b483c9f8755cd23a4040cac06eafbb474 '{image:$image,digest:$digest,source:$source}' >> evidence/registry-images.jsonl
          done
          (cd evidence && sha256sum -- * > SHA256SUMS)
      - name: Retain exact official runtime readback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-storage-0.11.1
          path: evidence/
          if-no-files-found: error
          retention-days: 30
